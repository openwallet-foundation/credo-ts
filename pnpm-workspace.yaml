packages:
  - packages/*
  - demo
  - demo-openid
  - samples/*

allowBuilds:
  '@hyperledger/anoncreds-nodejs': true
  '@hyperledger/indy-vdr-nodejs': true
  '@openwallet-foundation/askar-nodejs': true
  cbor-extract: true
  cpu-features: false
  esbuild: false
  koffi: true
  protobufjs: false
  secp256k1: false
  ssh2: false
  zstd-napi: true

catalog:
  '@animo-id/pex': ^6.1.1
  '@astronautlabs/jsonpath': ^1.1.2
  '@biomejs/biome': 2.5.14
  # Keep the cheqd dependencies aligned with the versions supported by @cheqd/sdk-esm.
  '@cheqd/sdk': npm:@cheqd/sdk-esm@5.5.1
  '@cheqd/ts-proto': ^4.2.0
  '@cosmjs/crypto': ^0.36.2
  '@cosmjs/proto-signing': ^0.36.2
  '@cosmjs/stargate': ^0.36.2
  # End @cheqd/sdk-esm-supported dependency versions.
  '@hyperledger/anoncreds-nodejs': ^0.4.1
  '@hyperledger/anoncreds-shared': ^0.4.1
  '@hyperledger/indy-vdr-nodejs': ^0.3.0
  '@hyperledger/indy-vdr-shared': ^0.3.0
  '@openwallet-foundation/askar-nodejs': 0.6.1
  '@openwallet-foundation/askar-shared': ^0.4.3 || ^0.5.0 || ^0.6.0
  '@panva/hpke-noble': ^1.1.4
  '@peculiar/x509': ^2.2.0
  '@sphereon/pex-models': ^2.3.2
  '@stablelib/ed25519': ^2.0.2
  '@types/express': ^5.0.6
  '@types/node': ^22.19.0
  '@types/ws': ^8.18.2
  '@typescript/native': npm:typescript@^7.0.2
  '@vitest/coverage-v8': ^5.0.5
  class-transformer: 0.5.1
  class-validator: ^0.14.3
  express: ^5.2.1
  hpke: ^1.1.4
  nock: ^15.0.2
  reflect-metadata: 0.2.2
  rxjs: ^7.8.2
  tsyringe: ^4.10.0
  typescript: npm:@typescript/typescript6@^6.0.2
  vitest: ^5.0.5
  ws: ^8.22.0
  zod: ^4.6.7

catalogs:
  dev:
    # askar-nodejs pins askar-shared exactly, keep this in sync with it
    '@openwallet-foundation/askar-shared': 0.6.1

minimumReleaseAgeExclude:
  - '@openid4vc/oauth2@0.7.0 || 0.8.0'
  - '@openid4vc/openid4vci@0.7.0 || 0.8.0'
  - '@openid4vc/openid4vp@0.7.0 || 0.8.0'
  - '@openid4vc/utils@0.7.0 || 0.8.0'
  - '@owf/cose@0.4.2 || 0.5.0'
  - '@owf/identity-common@0.4.2 || 0.5.0'
  - '@owf/mdoc@0.8.2 || 0.8.3'
  - '@owf/token-status-list@0.4.2 || 0.5.0'
  - '@sd-jwt/core@0.22.0 || 0.23.0'
  - '@sd-jwt/sd-jwt-vc@0.22.0 || 0.23.0'
  - '@peculiar/x509@2.2.0'
  - nock@15.0.2
