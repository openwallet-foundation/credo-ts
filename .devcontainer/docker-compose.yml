networks:
  local_credo_network:
    name: local_credo_network

services:
  credo:
    image: mcr.microsoft.com/devcontainers/javascript-node:4.0.13-24-bookworm
    working_dir: /work
    tty: true
    volumes:
      - ../:/work
      - /work/node_modules
    networks:
      - local_credo_network
    env_file:
      - devcontainer.env

  postgres:
    networks:
      - local_credo_network
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    networks:
      - local_credo_network
    image: valkey/valkey:9.1.3
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
