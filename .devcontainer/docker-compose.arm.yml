networks:
  local_credo_network:
    name: local_credo_network

services:
  credo:
    image: mcr.microsoft.com/devcontainers/javascript-node:5-26-bookworm
    working_dir: /work
    tty: true
    volumes:
      - ../:/work
      - /work/node_modules
    networks:
      - local_credo_network
    env_file:
      - devcontainer.env

  postgres:
    networks:
      - local_credo_network
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    networks:
      - local_credo_network
    image: valkey/valkey:9.1.2
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  indy-pool:
    networks:
      - local_credo_network
    build:
      context: ../.
      dockerfile: network/indy-pool-arm.dockerfile
    platform: linux/arm64/v8
    ports:
      - '9701-9708:9701-9708'
    # Start supervisord in bg, run commands, bring supervisor to fg.
    # The ready marker is written once the DIDs the tests depend on are on the ledger
    command: >
      /bin/bash -c "
        rm -f /tmp/indy-pool-ready;
        /usr/bin/supervisord &
        indy-cli-setup &&
        add-did-from-seed 00000000000000000000000Endorser9 ENDORSER &&
        add-did-from-seed 000000000000000000000000Trustee9 TRUSTEE &&
        touch /tmp/indy-pool-ready &&
        /usr/bin/supervisord -n
      "
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/indy-pool-ready']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  cheqd-ledger:
    networks:
      - local_credo_network
    image: ghcr.io/cheqd/cheqd-node:4.2.1
    container_name: cheqd-validator
    platform: linux/arm64/v8
    ports:
      - '26657:26657'
    command: >
      /bin/bash -c '
      mock-price-feed &
      rm -f /tmp/cheqd-ledger-ready;
      cheqd-noded init "validator-node" --chain-id "testnet" --home "/tmp/.single-node" &&
      (echo "12345678") | cheqd-noded keys add validator --keyring-backend test --home "/tmp/.single-node" &&
      cheqd-noded genesis add-genesis-account $(cheqd-noded keys show validator -a --keyring-backend test --home "/tmp/.single-node") 100000000000000000ncheq --home "/tmp/.single-node" &&
      cheqd-noded genesis gentx validator 5000000000000000ncheq --chain-id testnet --keyring-backend test --home "/tmp/.single-node" &&
      cheqd-noded genesis collect-gentxs --home "/tmp/.single-node" &&
      sed -i 's/"stake"/"ncheq"/' "/tmp/.single-node/config/genesis.json" &&
      sed -i "s/\"vote_extensions_enable_height\"[[:space:]]*:[[:space:]]*\"0\"/\"vote_extensions_enable_height\": \"1\"/g" "/tmp/.single-node/config/genesis.json" &&
      sed -i "/\"fee_params\"/,/\"burn_factor\"/ s/\"ncheq\"/\"usd\"/g" "/tmp/.single-node/config/genesis.json" &&
      sed -i "/\"create_did\":/,/\"update_did\":/ { s/\"min_amount\": \"50000000000\"/\"min_amount\": \"2000000000000000000\"/g; s/\"max_amount\": \"100000000000\"/\"max_amount\": \"2000000000000000000\"/g }" "/tmp/.single-node/config/genesis.json" &&
      sed -i "/\"update_did\":/,/\"deactivate_did\":/ { s/\"min_amount\": \"25000000000\"/\"min_amount\": \"1000000000000000000\"/g }" "/tmp/.single-node/config/genesis.json" &&
      sed -i "/\"deactivate_did\":/,/\"burn_factor\":/ { s/\"min_amount\": \"10000000000\"/\"min_amount\": \"400000000000000000\"/g; s/\"max_amount\": \"20000000000\"/\"max_amount\": \"400000000000000000\"/g }" "/tmp/.single-node/config/genesis.json" &&
      sed -i "/\"image\":/,/\"json\":/ { s/\"min_amount\": \"20000000000\"/\"min_amount\": \"100000000000000000\"/g; s/\"max_amount\": \"30000000000\"/\"max_amount\": \"100000000000000000\"/g }" "/tmp/.single-node/config/genesis.json" &&
      sed -i "/\"json\":/,/\"default\":/ { s/\"min_amount\": \"3500000000\"/\"min_amount\": \"400000000000000000\"/g; s/\"max_amount\": \"60000000000\"/\"max_amount\": \"400000000000000000\"/g }" "/tmp/.single-node/config/genesis.json" &&
      sed -i "/\"default\":/,/\"burn_factor\":/ { s/\"min_amount\": \"6000000000\"/\"min_amount\": \"200000000000000000\"/g; s/\"max_amount\": \"20000000000\"/\"max_amount\": \"200000000000000000\"/g }" "/tmp/.single-node/config/genesis.json" &&
      sed -i "s/\"burn_factor\": \"0.500000000000000000\"/\"burn_factor\": \"0.990000000000000000\"/g" "/tmp/.single-node/config/genesis.json" &&
      sed -i "s/minimum-gas-prices = \"\"/minimum-gas-prices = \"50ncheq\"/g" "/tmp/.single-node/config/app.toml" &&
      sed -i "s/enable = false/enable = true/g" "/tmp/.single-node/config/app.toml" &&
      sed -i "s|laddr = \"tcp://127.0.0.1:26657\"|laddr = \"tcp://0.0.0.0:26657\"|g" "/tmp/.single-node/config/config.toml" &&
      sed -i "s|addr_book_strict = true|addr_book_strict = false|g" "/tmp/.single-node/config/config.toml" &&
      sed -i "s/timeout_propose = \"3s\"/timeout_propose = \"500ms\"/g" "/tmp/.single-node/config/config.toml" &&
      sed -i "s/timeout_prevote = \"1s\"/timeout_prevote = \"500ms\"/g" "/tmp/.single-node/config/config.toml" &&
      sed -i "s/timeout_precommit = \"1s\"/timeout_precommit = \"500ms\"/g" "/tmp/.single-node/config/config.toml" &&
      sed -i "s/timeout_commit = \"5s\"/timeout_commit = \"500ms\"/g" "/tmp/.single-node/config/config.toml" &&
      sed -i "s/log_level = \"info\"/log_level = \"debug\"/g" "/tmp/.single-node/config/config.toml" &&
      wget -O /tmp/.single-node/config/price-feeder.toml https://raw.githubusercontent.com/cheqd/cheqd-node/refs/tags/v4.2.0/pricefeeder/price-feeder.toml &&
      sed -i "s|rest = \"https://api.mexc.com/\"|rest = \"http://localhost:8080\"|g" "/tmp/.single-node/config/price-feeder.toml" &&
      sed -i "s|websocket = \"wbs-api.mexc.com\"|websocket = \"localhost:8080\"|g" "/tmp/.single-node/config/price-feeder.toml" &&
      sed -i "s|config_path = \"\"|config_path = \"/tmp/.single-node/config/price-feeder.toml\"|g" "/tmp/.single-node/config/app.toml" &&
      sed -i "s|log_level = \"\"|log_level = \"info\"|g" "/tmp/.single-node/config/app.toml" &&
      sed -i "s|enable = \"\"|enable = \"true\"|g" "/tmp/.single-node/config/app.toml" &&
      cheqd-noded start --home "/tmp/.single-node"  --pricefeeder.enable=true --pricefeeder.config_path="/tmp/.single-node/config/price-feeder.toml" &
      RUN_TESTNET_PID=$! &&
      sleep 10 &&
      (echo "sketch mountain erode window enact net enrich smoke claim kangaroo another visual write meat latin bacon pulp similar forum guilt father state erase bright"; echo "12345678";) | cheqd-noded keys add base --recover --keyring-backend test --home "/tmp/.single-node" &&
      (echo "silk theme damp share lens select artefact orbit artwork weather mixture alarm remain oppose own wolf reduce melody cheap venture lady spy wise loud"; echo "12345678") | cheqd-noded keys add extra1 --recover --keyring-backend test --home "/tmp/.single-node" &&
      (echo "lobster pizza cost soft else rather rich find rose pride catch bar cube switch help joy stable dirt stumble voyage bind cabbage cram exist"; echo "12345678") | cheqd-noded keys add extra2 --recover --keyring-backend test --home "/tmp/.single-node" &&
      (echo "state online hedgehog turtle daring lab panda bottom agent pottery mixture venue letter decade bridge win snake mandate trust village emerge awkward fire mimic"; echo "12345678") | cheqd-noded keys add extra3 --recover --keyring-backend test --home "/tmp/.single-node" &&
      (echo "hire violin basic rare nerve demand sea drastic pet bench glass salad steak between action field diamond recipe bind success erase sleep next mirror"; echo "12345678") | cheqd-noded keys add extra4 --recover --keyring-backend test --home "/tmp/.single-node" &&
      (echo "12345678") | cheqd-noded tx bank multi-send validator cheqd1rnr5jrt4exl0samwj0yegv99jeskl0hsxmcz96 cheqd1yeahnxhfa583wwpm9xt452xzet4xsgsqacgjkr cheqd14y3xeqd2xmhl9sxn8cf974k6nntqrveufqpqrs cheqd10qh2vl0jrax6yh2mzes03cm6vt27vd47geu375 cheqd18kgq9rycwmdluyjtnkv3jn57ttspu639fug2s2 10000000000000000ncheq --gas auto --gas-adjustment=1.8 --fees 10000000000ncheq --chain-id testnet --keyring-backend test --home "/tmp/.single-node" -y &&
      until cheqd-noded query bank balances cheqd18kgq9rycwmdluyjtnkv3jn57ttspu639fug2s2 --home "/tmp/.single-node" | grep -q 10000000000000000; do sleep 1; done &&
      until cheqd-noded query oracle convert-usdc-to-cheq 2000000000000000000usd wma BALANCED --home "/tmp/.single-node" 2>/dev/null | grep -q ncheq; do sleep 1; done &&
      touch /tmp/cheqd-ledger-ready &&
      wait $$RUN_TESTNET_PID;
      '
    # Only healthy once the test accounts are funded and the oracle can price DID fees
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/cheqd-ledger-ready']
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 20s
